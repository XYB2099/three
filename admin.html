<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员设置 · 夏一博</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <!-- 密码门 -->
  <div class="admin__gate" id="gate">
    <div class="admin__card">
      <h1>管理员设置</h1>
      <p class="admin__hint">请输入密码以进入管理员界面</p>
      <input type="password" id="pw-input" class="admin__input" placeholder="密码" autocomplete="current-password" />
      <p class="admin__error" id="pw-error"></p>
      <button class="btn btn--primary" id="pw-submit" type="button" style="width:100%">进入</button>
      <a class="admin__back" href="home.html">← 返回主页</a>
    </div>
  </div>

  <!-- 编辑器 -->
  <div class="admin__editor" id="editor" hidden>
    <header class="admin__bar">
      <h1>管理员设置</h1>
      <div class="admin__bar-actions">
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="切换主题">
          <span class="theme-toggle__icon">🌙</span>
        </button>
        <a class="btn btn--ghost" href="home.html">查看主页</a>
        <button class="btn btn--ghost" id="btn-logout" type="button">退出</button>
        <button class="btn btn--ghost" id="btn-reset" type="button">恢复默认</button>
        <button class="btn btn--primary" id="btn-save" type="button">保存</button>
      </div>
    </header>
    <main class="admin__form" id="admin-form"></main>
    <p class="admin__saved" id="saved-toast"></p>
  </div>

  <!-- 导出结果弹窗 -->
  <div class="admin__modal" id="data-modal" hidden>
    <div class="admin__modal-card">
      <h2>已生成 data.json</h2>
      <p class="admin__hint">请把下面的内容保存为 data.json 文件，上传到 GitHub 仓库根目录（和 index.html、home.html 同一层）。</p>
      <textarea id="data-output" class="admin__output" readonly></textarea>
      <div class="admin__modal-actions">
        <button class="btn btn--primary" id="btn-download-json" type="button">下载 data.json</button>
        <button class="btn btn--ghost" id="btn-copy-json" type="button">复制 JSON</button>
        <button class="btn btn--ghost" id="btn-modal-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
